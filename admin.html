function reproducirSonidoNotificacion() {

function pedirPermisoNotificaciones() {

  if (!("Notification" in window)) {
    console.log("Este navegador no admite notificaciones.");
    return;
  }

  if (Notification.permission === "default") {

    Notification.requestPermission().then((permiso) => {

      console.log(
        "Permiso de notificaciones:",
        permiso
      );

    });

  }

}


document.addEventListener(
  "click",
  pedirPermisoNotificaciones,
  { once: true }
);


function mostrarNotificacionNavegador(
  usuarioId,
  nombre,
  texto
) {

  if (
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ) {
    return;
  }

 const notificacion = new Notification(
  "Nuevo mensaje de " + nombre,
  {
    body: texto
  }
);

notificacion.onclick = () => {

  window.focus();

  abrirConversacion(

    nombre
  );

  notificacion.close();

};

cerrarSesion.addEventListener("click", async () => {

  window.location.replace("login.html");

});


// ========================================
// ACTUALIZAR BURBUJA DE NOTIFICACIÓN
// ========================================

function actualizarNotificacion(usuarioId) {

  document
    .querySelectorAll(".cliente")
    .forEach(cliente => {

      const id =
        cliente.querySelector(".cliente-id");

      if (!id || id.textContent !== usuarioId) {
        return;
      }

      const notificacion =
        cliente.querySelector(".notificacion");

      if (!notificacion) return;

      const nombre =
      cliente.querySelector(".cliente-nombre");
    
      const cantidad =
      mensajesVistos[usuarioId] || 0;

      if (cantidad > 0) {

        notificacion.textContent = cantidad;

        notificacion.classList.remove("oculta");
        
        if (nombre) {
        nombre.style.color = "#075e54";
        nombre.style.fontWeight = "bold";
        }
        
        nombre.style.fontWeight = "bold";
        nombre.style.color = "#075e54";
      
      } else {

        notificacion.textContent = "0";

        notificacion.classList.add("oculta");

        if (nombre) {
        nombre.style.color = "#222";
        nombre.style.fontWeight = "bold";
}
  }
    });

}
function actualizarTituloPagina() {

  if (totalNoLeidos > 0) {

    document.title =
      "(" + totalNoLeidos + ") Red Canbrelú - Admin";

  } else {

    document.title =
      "Red Canbrelú - Admin";

  }

}

// ========================================
// ACTIVAR NOTIFICACIONES DE UN CLIENTE
// ========================================

function activarNotificaciones(usuarioId) {

  if (listenersNotificaciones[usuarioId]) {
    return;
  }

  const referenciaMensajes = query(
    ref(
      db,
      "conversaciones/" +
      usuarioId +
      "/mensajes"
    ),
    limitToLast(1)
  );

  let primerMensaje = true;

  listenersNotificaciones[usuarioId] =
    onChildAdded(
      referenciaMensajes,
      (snapshot) => {

        const datos = snapshot.val();

        if (!datos) return;


        // Al abrir el administrador,
        // ignorar el último mensaje que ya existía
        if (primerMensaje) {

          primerMensaje = false;

          return;
        }


        // Ignorar mensajes enviados por administrador
        if (datos.tipo === "admin") {
          return;
        }


        // Si estamos mirando este chat,
        // no generar notificación
        if (usuarioSeleccionado === usuarioId) {
          return;
        }


        if (!mensajesVistos[usuarioId]) {
          mensajesVistos[usuarioId] = 0;
        }

        mensajesVistos[usuarioId]++;

        totalNoLeidos++;

        actualizarNotificacion(usuarioId);

        actualizarTituloPagina();


        const clienteNuevo =
          [...document.querySelectorAll(".cliente")]
            .find(cliente => {

              const id =
                cliente.querySelector(".cliente-id");

              return (
                id &&
                id.textContent === usuarioId
              );

            });

        if (clienteNuevo) {
          listaClientes.prepend(clienteNuevo);
        }


        reproducirSonidoNotificacion();

        mostrarNotificacionNavegador(
          usuarioId,
          datos.nombre || "Cliente",
          datos.texto || "Nuevo mensaje"
        );

      }
    );

}

// ========================================
// LISTAR CLIENTES
// ========================================

const consultaConversaciones = query(
  ref(db, "conversaciones"),
  orderByChild("ultimoMensaje"),
  limitToLast(50)
);

onValue(
  consultaConversaciones,
  (snapshot) => {

    listaClientes.innerHTML = "";

    const conversaciones =
      snapshot.val();

    if (!conversaciones) {

      listaClientes.innerHTML =
        '<div style="padding:15px;color:#777;">Todavía no hay clientes.</div>';

      return;

    }

    Object.entries(conversaciones)
  .sort((a, b) => {

    const fechaA =
      a[1].ultimoMensaje || 0;

    const fechaB =
      b[1].ultimoMensaje || 0;

    return fechaB - fechaA;
  })
  .forEach(
    ([usuarioId, conversacion]) => {

        if (!conversacion.info) {
          return;
        }

        const info =
          conversacion.info;


        // CONTENEDOR CLIENTE

        const cliente =
          document.createElement("div");

        cliente.classList.add("cliente");

        if (usuarioId === usuarioSeleccionado) {
          cliente.classList.add("activo");
        }


        // PARTE SUPERIOR

        const superior =
          document.createElement("div");

        superior.classList.add(
          "cliente-superior"
        );


        // NOMBRE

        const nombre =
          document.createElement("div");

        nombre.classList.add(
          "cliente-nombre"
        );

        nombre.textContent =
          info.nombre || "Usuario";

// ========================================
// ABRIR CONVERSACIÓN
// ========================================

function abrirConversacion(
  usuarioId,
  nombre
) {

  usuarioSeleccionado = usuarioId;
  nombreSeleccionado = nombre;


  // Borrar notificaciones pendientes

 const pendientes =
  mensajesVistos[usuarioId] || 0;

totalNoLeidos -= pendientes;

if (totalNoLeidos < 0) {
  totalNoLeidos = 0;
}

mensajesVistos[usuarioId] = 0;

actualizarNotificacion(usuarioId);

actualizarTituloPagina();

  // Título

  tituloChat.textContent = nombre;

  if (cancelarEstado) {
  cancelarEstado();
  cancelarEstado = null;
}

const referenciaEstado = ref(
  db,
  "conversaciones/" + usuarioId + "/estado"
);

const referenciaAdminEscribiendo = ref(
  db,
  "conversaciones/" + usuarioId + "/adminEscribiendo"
);
  
const referenciaEscribiendo = ref(
  db,
  "conversaciones/" + usuarioId + "/escribiendo"
);

let estadoActualCliente = null;


// MOSTRAR ESTADO DEL CLIENTE

function mostrarEstadoCliente() {

  if (clienteEstaEscribiendo) {
    estadoCliente.textContent = "✍️ Escribiendo...";
    return;
  }

  const estado = estadoActualCliente;

  if (!estado) {
    estadoCliente.textContent = "";
    return;
  }

  if (estado.enLinea === true) {
    estadoCliente.textContent = "🟢 En línea";
    return;
  }

  if (estado.ultimaConexion) {

    const fecha =
      new Date(estado.ultimaConexion);

    const hoy =
      new Date();

    const esHoy =
      fecha.toDateString() ===
      hoy.toDateString();

    if (esHoy) {

      estadoCliente.textContent =
        "Última vez hoy " +
        fecha.toLocaleTimeString(
          "es-AR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    } else {

      estadoCliente.textContent =
        "Última vez " +
        fecha.toLocaleDateString(
          "es-AR",
          {
            day: "2-digit",
            month: "2-digit"
          }
        ) +
        " " +
        fecha.toLocaleTimeString(
          "es-AR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    }

  }

}

// ESCUCHAR SI ESTÁ ESCRIBIENDO

if (cancelarEscribiendo) {
  cancelarEscribiendo();
  cancelarEscribiendo = null;
}

clienteEstaEscribiendo = false;

cancelarEscribiendo = onValue(
  referenciaEscribiendo,
  (snapshot) => {

    clienteEstaEscribiendo =
      snapshot.val() === true;

    mostrarEstadoCliente();

  }
);
  
// ESCUCHAR ESTADO EN LÍNEA

cancelarEstado = onValue(
  referenciaEstado,
  (snapshot) => {

    estadoActualCliente =
      snapshot.val();

    mostrarEstadoCliente();

  }
);
  
  // Habilitar campo

 input.disabled = false;
botonEnviar.disabled = false;
botonArchivoAdmin.disabled = false;

  input.focus();


  // MARCAR CLIENTE ACTIVO

  document
    .querySelectorAll(".cliente")
    .forEach(cliente => {

      cliente.classList.remove("activo");

      const id =
        cliente.querySelector(".cliente-id");

      if (
        id &&
        id.textContent === usuarioId
      ) {

        cliente.classList.add("activo");

      }

    });


  // EN CELULAR IR AL CHAT

  if (window.innerWidth <= 700) {

    document
      .querySelector(".chat")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  // LIMPIAR CHAT ANTERIOR

  listaMensajes.innerHTML = "";


  // CANCELAR LISTENER ANTERIOR

  if (cancelarMensajes) {

    cancelarMensajes();

    cancelarMensajes = null;

  }

  // CARGAR MENSAJES

cancelarMensajes =
  onChildAdded(
    query(
      ref(
        db,
        "conversaciones/" +
        usuarioId +
        "/mensajes"
      ),
      limitToLast(50)
    ),
    (snapshot) => {

      const datos =
  snapshot.val();

if (!datos) return;

mostrarMensaje(datos, snapshot.key);

// MARCAR COMO LEÍDO SI ES MENSAJE DEL CLIENTE
if (
  datos.tipo === "cliente" &&
  datos.leido !== true
) {
  set(
    ref(
      db,
      "conversaciones/" +
      usuarioId +
      "/mensajes/" +
      snapshot.key +
      "/leido"
    ),
    true
  );
}
       }
  );

// CANCELAR LISTENER DE LEÍDOS DEL CHAT ANTERIOR
if (cancelarLeidos) {
  cancelarLeidos();
  cancelarLeidos = null;
}

// ESCUCHAR CAMBIOS DE ✓ A ✓✓
cancelarLeidos = onChildChanged(
  ref(
    db,
    "conversaciones/" +
    usuarioId +
    "/mensajes"
  ),
  (snapshot) => {

    const datos = snapshot.val();
        
    if (!datos || datos.tipo !== "admin") {
      return;
    }

    const mensaje = document.querySelector(
      '.mensaje[data-id="' + snapshot.key + '"]'
    );

    if (!mensaje) return;

    const hora = mensaje.querySelector(".hora");

    if (!hora || !datos.fecha) return;

    const fecha = new Date(datos.fecha);

    let textoHora =
      fecha.toLocaleTimeString(
        "es-AR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    if (datos.leido === true) {
      textoHora += "  ✓✓";
    } else {
      textoHora += "  ✓";
    }

    hora.textContent = textoHora;
  }
);

}
  
// ========================================
// MOSTRAR MENSAJE
// ========================================

function mostrarMensaje(datos, mensajeId) {
  const mensaje =
    document.createElement("div");

  mensaje.dataset.id = mensajeId;
  
  mensaje.classList.add("mensaje");


  if (datos.tipo === "admin") {

    mensaje.classList.add(
      "admin-msg"
    );

  } else {

    mensaje.classList.add(
      "cliente-msg"
    );

  }


  // NOMBRE

  const nombre =
    document.createElement("span");

  nombre.classList.add("nombre");

  if (datos.tipo === "admin") {

    nombre.textContent =
      "Administrador";

  } else {

    nombre.textContent =
      datos.nombre ||
      nombreSeleccionado;

  }


// TEXTO O ARCHIVO

const texto = document.createElement("span");

if (datos.archivo === true && datos.archivoUrl) {

if (
  datos.archivoTipo &&
  datos.archivoTipo.startsWith("image/")
) {

  const imagen = document.createElement("img");

  imagen.src = datos.archivoUrl;
  imagen.alt = datos.archivoNombre || "Imagen";

  imagen.style.maxWidth = "100%";
  imagen.style.maxHeight = "300px";
  imagen.style.borderRadius = "8px";
  imagen.style.cursor = "pointer";
  imagen.style.display = "block";

  imagen.addEventListener("click", () => {
    window.open(datos.archivoUrl, "_blank");
  });

  texto.appendChild(imagen);

} else {

  const enlace = document.createElement("a");

  enlace.href = datos.archivoUrl;
  enlace.target = "_blank";
  enlace.rel = "noopener noreferrer";

  enlace.textContent =
    "📎 " + (datos.archivoNombre || "Abrir archivo");

  enlace.style.color = "#075e54";
  enlace.style.fontWeight = "bold";
  enlace.style.textDecoration = "none";

  texto.appendChild(enlace);
}

if (datos.archivoTamano) {

  const tamano = document.createElement("span");

  const mb = datos.archivoTamano / (1024 * 1024);

  tamano.textContent =
    mb >= 1
      ? mb.toFixed(2) + " MB"
      : (datos.archivoTamano / 1024).toFixed(1) + " KB";

  tamano.style.display = "block";
  tamano.style.fontSize = "11px";
  tamano.style.color = "#777";
  tamano.style.marginTop = "3px";

  texto.appendChild(tamano);
}
  
} else {

  texto.textContent = datos.texto || "";

}
  
  // HORA

  const hora =
    document.createElement("span");

  hora.classList.add("hora");

 if (datos.fecha) {

  const fecha =
    new Date(datos.fecha);

  let textoHora =
    fecha.toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  // Mostrar ✓ / ✓✓ solamente
  // en mensajes enviados por el administrador
  if (datos.tipo === "admin") {

    if (datos.leido === true) {
      textoHora += "  ✓✓";
    } else {
      textoHora += "  ✓";
    }

  }

  hora.textContent = textoHora;
}

  mensaje.appendChild(nombre);
  mensaje.appendChild(texto);
  mensaje.appendChild(hora);

  listaMensajes.appendChild(mensaje);


  // BAJAR AL ÚLTIMO MENSAJE

  listaMensajes.scrollTop =
    listaMensajes.scrollHeight;

}

async function enviarArchivoAdmin() {

  const archivo = archivoAdmin.files[0];

  if (!archivo || !usuarioSeleccionado) return;

  if (archivo.size > 10 * 1024 * 1024) {
    alert("El archivo supera los 10 MB.");
    archivoAdmin.value = "";
    return;
  }

  try {

    const formData = new FormData();

    formData.append("file", archivo);
    formData.append("upload_preset", "chat_archivos");
    
    const respuesta = await fetch(
      "https://api.cloudinary.com/v1_1/qqmjx1vh/auto/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado?.error?.message ||
        "No se pudo subir el archivo."
      );
    }

    const url = resultado.secure_url;

    await push(
      ref(
        db,
        "conversaciones/" +
        usuarioSeleccionado +
        "/mensajes"
      ),
      {
        tipo: "admin",
        nombre: "Administrador",
        fecha: Date.now(),
        leido: false,
        archivo: true,
        archivoNombre: archivo.name,
        archivoTipo: archivo.type,
        archivoTamano: archivo.size,
        archivoUrl: url,
        texto: ""
      }
    );

    await set(
      ref(
        db,
        "conversaciones/" +
        usuarioSeleccionado +
        "/ultimoMensaje"
      ),
      Date.now()
    );

    await set(
      ref(
        db,
        "conversaciones/" +
        usuarioSeleccionado +
        "/ultimoTexto"
      ),
      "Vos: 📎 " + archivo.name
    );

    archivoAdmin.value = "";

  } catch (error) {

    console.error("ERROR AL SUBIR ARCHIVO:", error);

    alert(
      "Error al subir archivo: " +
      error.message
    );

    archivoAdmin.value = "";
  }
}

async function enviarNotificacionPush(usuarioId, texto) {

  try {

    const tokenSnapshot = await new Promise((resolve) => {

      onValue(
        ref(
          db,
          "conversaciones/" +
          usuarioId +
          "/fcmToken"
        ),
        resolve,
        { onlyOnce: true }
      );

    });

    const token = tokenSnapshot.val();

    if (!token) {
      console.log(
        "El cliente no tiene token FCM"
      );
      return;
    }

const usuarioAdmin = auth.currentUser;

if (!usuarioAdmin) {
  console.error("Administrador no autenticado");
  return;
}

const idToken = await usuarioAdmin.getIdToken();
    
    const respuesta = await fetch(
      "https://canbrelu-notificaciones.memax1xamem.workers.dev/",
      {
        method: "POST",

       headers: {
  "Content-Type": "application/json",
  "Authorization": "Bearer " + idToken
},

        body: JSON.stringify({
  token: token,
  titulo: "Red Canbrelú Chat",
  mensaje: texto,
  usuarioId: usuarioId
})
      }
    );

    const resultado = await respuesta.json();

    console.log(
      "NOTIFICACIÓN PUSH:",
      resultado
    );

  } catch (error) {

    console.error(
      "ERROR NOTIFICACIÓN PUSH:",
      error
    );

  }
}

// SIN RECARGAR EL ADMINISTRADOR
// ========================================

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.addEventListener(
    "message",
    (event) => {

      if (
        event.data?.tipo !== "ABRIR_CHAT" ||
        !event.data?.usuarioId
      ) {
        return;
      }

      const usuarioId = event.data.usuarioId;

      const cliente = [...document.querySelectorAll(".cliente")]
        .find(elemento => {

          const id =
            elemento.querySelector(".cliente-id");

          return (
            id &&
            id.textContent === usuarioId
          );
        });

      if (!cliente) {
        console.log(
          "No se encontró el cliente:",
          usuarioId
        );
        return;
      }

      const nombre =
        cliente.querySelector(".cliente-nombre")
          ?.textContent || "Usuario";

      abrirConversacion(
        usuarioId,
        nombre
      );

    }
  );
